<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Sama õppeaeg ühel õhtul versus jaotatuna üle nädala">
  <text x="180" y="38" text-anchor="middle" fill="#4527a0" font-family="sans-serif" font-size="17" font-weight="600">Üks õhtu</text>
  <text x="500" y="38" text-anchor="middle" fill="#4527a0" font-family="sans-serif" font-size="17" font-weight="600">Üle nädala</text>
  <line x1="70" y1="230" x2="300" y2="230" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="390" y1="230" x2="630" y2="230" stroke="#9e9e9e" stroke-width="1.5"/>
  <rect x="245" y="80" width="30" height="150" rx="4" fill="#5e35b1"/>
  <rect x="405" y="180" width="30" height="50" rx="4" fill="#5e35b1"/>
  <rect x="485" y="180" width="30" height="50" rx="4" fill="#5e35b1"/>
  <rect x="565" y="180" width="30" height="50" rx="4" fill="#5e35b1"/>
  <g fill="#616161" font-family="sans-serif" font-size="14">
    <text x="100" y="250" text-anchor="middle">E</text>
    <text x="140" y="250" text-anchor="middle">T</text>
    <text x="180" y="250" text-anchor="middle">K</text>
    <text x="220" y="250" text-anchor="middle">N</text>
    <text x="260" y="250" text-anchor="middle">R</text>
    <text x="420" y="250" text-anchor="middle">E</text>
    <text x="460" y="250" text-anchor="middle">T</text>
    <text x="500" y="250" text-anchor="middle">K</text>
    <text x="540" y="250" text-anchor="middle">N</text>
    <text x="580" y="250" text-anchor="middle">R</text>
  </g>
  <text x="340" y="285" text-anchor="middle" fill="#212121" font-family="sans-serif" font-size="15">Sama aeg kokku — jaotatud jääb paremini meelde</text>
</svg>
